# Publishes the splash page and every app to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# (Pages on a private repository needs a paid GitHub plan; on a public repo it's free.)
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test apps
        run: |
          for t in apps/*/tests/*.test.mjs; do [ -f "$t" ] && node --test "$t"; done
      - name: Build site
        run: ./scripts/build-site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
