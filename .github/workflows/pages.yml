# Publishes the splash page and every app to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# (Pages on a private repository needs a paid GitHub plan; on a public repo it's free.)
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"   # daily: rebuild so Page Doctor / Creator Match pick up fresh Steam data

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test apps
        run: |
          for t in apps/*/tests/*.test.mjs; do [ -f "$t" ] && node --test "$t"; done
      - name: Build site
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Pushes publish straight away with the saved data; only the daily/manual runs fetch fresh Steam data.
          SKIP_FETCH: ${{ github.event_name == 'push' && '1' || '' }}
        run: |
          # Page Doctor first, so Creator Match can reuse its fresh Steam corpus.
          (cd apps/page-doctor && ./scripts/build.sh)
          REUSE_FETCHED=1 ./scripts/build-site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
