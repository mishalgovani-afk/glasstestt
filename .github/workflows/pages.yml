# Publishes the web app to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# (Pages on a private repository needs a paid GitHub plan; on a public repo it's free.)
name: Deploy web app to Pages

on:
  push:
    branches: [main, claude/hush-subvocal-decoder]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: web
        run: node --test tests/*.test.mjs && ./scripts/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
