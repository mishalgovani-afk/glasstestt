# Publishes the splash page and every app to GitHub Pages. Fast: no data fetching here.
# Page Doctor / Creator Match read their saved live data from the `data` branch
# (filled by data-refresh.yml daily and by add-game.yml on demand).
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test apps
        run: |
          for t in apps/*/tests/*.test.mjs; do [ -f "$t" ] && node --test "$t"; done
      - name: Load saved live data
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/seed-data.sh _data
      - name: Build site
        env:
          SKIP_FETCH: "1"
        run: DATA_DIR="$PWD/_data" ./scripts/build-site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
