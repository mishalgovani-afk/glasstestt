# Manually run the Steam / creator data fetchers on any branch and upload the results,
# so data scripts can be tested against the live sites (dev sandboxes can't reach Steam).
name: Data preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build data apps
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          for app in page-doctor creator-match; do
            if [ -x "apps/$app/scripts/build.sh" ]; then
              echo "::group::$app"; (cd "apps/$app" && ./scripts/build.sh); echo "::endgroup::"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: apps/*/dist/data/
