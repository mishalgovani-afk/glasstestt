# Daily: fetch fresh Steam + creator data (indies first), merge it into the saved data on the
# `data` branch, then republish the site.
name: Data refresh

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      creators_only:
        description: "Skip the Page Doctor fetch and only refresh creators"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Load saved live data
        run: .github/scripts/seed-data.sh _data
      - name: Fetch Page Doctor data
        if: ${{ !inputs.creators_only }}
        env:
          PD_DEADLINE_MIN: "150"
        run: (cd apps/page-doctor && DATA_DIR="$GITHUB_WORKSPACE/_data" ./scripts/build.sh)
      - name: Save Page Doctor data
        if: ${{ !inputs.creators_only }}
        run: |
          mkdir -p _new/page-doctor && cp apps/page-doctor/dist/data/*.json _new/page-doctor/
          NEW_DIR=_new .github/scripts/commit-data.sh "Data refresh: Page Doctor"
      - name: Fetch Creator Match data
        env:
          CM_DEADLINE_MIN: "60"
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: (cd apps/creator-match && DATA_DIR="$GITHUB_WORKSPACE/_data" CORPUS_PATH="$( [ -s "$GITHUB_WORKSPACE/apps/page-doctor/dist/data/corpus.json" ] && echo "$GITHUB_WORKSPACE/apps/page-doctor/dist/data/corpus.json" || echo "$GITHUB_WORKSPACE/_data/page-doctor/corpus.json" )" ./scripts/build.sh)
      - name: Save Creator Match data
        run: |
          rm -rf _new && mkdir -p _new/creator-match && cp apps/creator-match/dist/data/creators.json _new/creator-match/
          NEW_DIR=_new .github/scripts/commit-data.sh "Data refresh: Creator Match"

  publish:
    needs: refresh
    if: always()
    uses: ./.github/workflows/pages.yml
