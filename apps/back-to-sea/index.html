<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06223a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A little fish hops from water to water through a house, all the way back to the sea.">
<title>Back to Sea</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231d6b97'/%3E%3Cpath d='M7 16c3-5 9-6 13-3l5-4v14l-5-4c-4 3-10 2-13-3z' fill='%23ff8a3d'/%3E%3Ccircle cx='11' cy='15' r='1.4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Back to Sea game"></canvas>

  <div id="touch" aria-hidden="true">
    <div class="tbtn left"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="tbtn right"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>
    <div class="tbtn jump"><svg viewBox="0 0 24 24"><path d="M12 19V6M6 11l6-6 6 6"/></svg><span>JUMP</span></div>
  </div>

  <div id="hud-buttons">
    <button id="btn-mute" class="hbtn" aria-label="Toggle sound">
      <svg class="on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
    <button id="btn-pause" class="hbtn" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
  </div>

  <div id="ui"></div>

  <div id="rotate" role="alert">
    <div class="phone"><div class="screen-s"></div></div>
    <p>Rotate your phone</p>
    <small>Back to Sea plays in landscape</small>
  </div>
  <div id="fade"></div>
  <div id="safe-probe" aria-hidden="true"></div>
</div>
<noscript>Back to Sea needs JavaScript.</noscript>
<script type="module" src="./js/main.js"></script>
</body>
</html>
